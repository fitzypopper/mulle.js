<!doctype html>
<html>

	<head>

		<meta charset="UTF-8" />

		<title>mulle.js</title>

		<!--
			GitHub Pages can serve this repository in two ways:

			1. The "Deploy to GitHub Pages" workflow uploads ./dist, so the site
			   root *is* dist/ and this file is never published.
			2. A branch based ("deploy from a branch") Pages source runs Jekyll
			   over the whole repo instead, which publishes the repository root
			   - and dist/ along with it.

			Only case 2 needs this file, so the <base> below is safe: it points
			every relative URL (phaser.min.js, bundle.js, style.css and the
			assets/ tree) at dist/, which is where the built game lives.
			The game only reads/writes location.hash, which <base> does not
			affect, so #world / #yard deep links keep working either way.
		-->
		<base href="dist/" />

		<script src="phaser.min.js"></script>
		<script src="bundle.js"></script>

		<link href="style.css" rel="stylesheet" />

		<script>

			window.addEventListener("DOMContentLoaded", function(e){
				console.debug('Launch');
				window.game.setup();
			});

		</script>

	</head>

	<body>

		<div id="wrapper">

			<div id="player"></div>

			<div id="settings">
				<button class="button" onclick="window.game.scale.startFullScreen();">fullscreen</button>
				<a class="button" href="progress/" target="_blank">progress</a>
				<a class="button" href="info/" target="_blank">info</a>
			</div>

			<div id="debug">
				<button class="button" onclick="window.game.mulle.debug = !window.game.mulle.debug; this.innerHTML = 'debug ' + (window.game.mulle.debug ? 'on' : 'off');">debug off</button>
				<button class="button" onclick="window.localStorage.removeItem('mulle_SaveData')">wipe save</button>
			</div>

			<div id="cheats"></div>

		</div>

		<p style="font: 14px sans-serif; margin: 1em;">
			If the game does not start, <a href="dist/index.html">open it directly</a>.
		</p>

	</body>

</html>
